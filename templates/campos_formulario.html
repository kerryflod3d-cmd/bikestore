{% if form.errors %}<div class="form-alert" role="alert">Revisa los campos indicados antes de continuar.</div>{% endif %}
{{ form.non_field_errors }}
<div class="form-grid">
    {% for field in form %}
        <div class="field {% if field.name == 'descripcion' %}full{% endif %}">
            <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required" aria-hidden="true">*</span>{% endif %}</label>
            {{ field }}
            {% if field.help_text %}<small class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
            {{ field.errors }}
        </div>
    {% endfor %}
</div>
